<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Matter Quest: Chemistry Study Buddy</title>
    <script>
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      try {
        const savedTheme = JSON.parse(localStorage.getItem('matterquest.theme.v1'));
        document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : systemTheme;
      } catch {
        document.documentElement.dataset.theme = systemTheme;
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <button id="home-btn" class="brand" type="button">Matter Quest</button>
      <span id="crumb" class="crumb"></span>
      <span class="header-label">A little science, every day.</span>
      <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-label="Dark mode" aria-checked="true" title="Switch to light mode"></button>
    </header>
    <main id="app" aria-live="polite"></main>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
